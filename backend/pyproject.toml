[project]
name = "waterlooworks-flash-next"
version = "0.1.0"
description = "Single-user WaterlooWorks retrieval and analysis backend"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "playwright>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/waterlooworks_flash_next"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["live: explicitly opted-in checks against WaterlooWorks (not implemented)"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
